<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>路面病害资产图谱 · RoadGS</title>
<link rel="stylesheet" href="style.css">
<header><div class="bar"><a class="brand" href="#A13">Road<span>GS</span></a><nav><a href="#library">资产目录 ↓</a><a href="../../docs/02-asset-reconstruction.md">重建方法 ↗</a></nav></div></header>
<main>
  <div class="heading"><h1>路面病害资产图谱</h1><p id="summary" aria-live="polite"></p></div>
  <article id="detail" hidden tabindex="-1">
    <div class="detailhead"><div><span class="mono" id="assetKey"></span><h2 id="assetTitle"></h2></div><span id="sourceType"></span></div>
    <div id="states" aria-label="同一资产的状态" hidden></div>
    <div class="evidence">
      <figure class="model"><a id="modelLink" target="_blank"><img id="model" alt=""></a><figcaption><span id="modelLabel"></span><span><button id="representation" type="button" hidden>看高斯渲染</button> <button id="cutaway" type="button" hidden>剖开井体</button> <button id="spin" type="button">360° 环绕</button> <button id="rotate" type="button">切换视角</button></span></figcaption></figure>
      <figure id="sourcePanel"><a id="sourceLink" target="_blank"><img id="source" alt=""></a><figcaption><span id="sourceLabel"></span><select id="sourceView" aria-label="选择资产输入观测" hidden></select><button id="switchSource" type="button" hidden>查看盖面原图</button></figcaption></figure>
      <figure id="roadPanel"><a id="roadLink" target="_blank"><img id="road" alt=""></a><figcaption><label>道路 <select id="scene"></select></label><button id="before" type="button">查看迁入前</button><span id="roadCompare" hidden></span></figcaption></figure>
    </div>
    <div class="details"><dl id="metrics"></dl><div id="downloads"></div></div>
    <p class="note" id="note"></p>
    <details id="capturePanel" hidden>
      <summary>查看落座模型在真实留出帧上的投影</summary>
      <p id="captureInfo"></p>
      <div class="capture-controls"><label>观测帧 <select id="captureView"></select></label><label>显示 <select id="captureMode"><option value="photo">实拍原图</option><option value="native">原始位姿</option><option value="registered">局部配准</option></select></label></div>
      <figure><a id="captureImageLink" target="_blank"><img id="captureImage" alt=""></a><figcaption><span id="captureLegend"></span><output id="captureScore"></output></figcaption></figure>
    </details>
    <details id="pitPanel" hidden>
      <summary id="pitHeading">比较多帧与单帧重建在留出照片上的表现</summary>
      <div class="capture-controls"><label>观测帧 <select id="pitFrame"></select></label><label>对照 <select id="pitMode"></select></label></div>
      <figure><a id="pitImageLink" target="_blank"><img id="pitImage" alt=""></a><figcaption><span id="pitLegend"></span><output id="pitScore"></output></figcaption></figure>
      <p id="pitDepth"></p>
    </details>
    <details id="reliefPanel" hidden>
      <summary>查看网格高程与剖面</summary>
      <div id="reliefContent" hidden>
        <div id="reliefPlots"><figure><canvas id="reliefMap" width="380" height="274" aria-label="资产俯视高程，点击选择截线"></canvas><figcaption id="reliefLegend"></figcaption></figure><figure><canvas id="reliefChart" width="650" height="274" aria-label="所选截线的米制高程剖面"></canvas><figcaption id="reliefScale"></figcaption></figure></div>
        <div id="reliefControls"><label>截线位置 <input id="reliefRow" type="range" min="0" max="96"></label><label id="gradeRange" hidden><input id="nearGrade" type="checkbox" checked> 放大路面附近高差</label><output id="reliefReadout"></output></div>
      </div><p id="reliefStatus" role="status"></p>
    </details>
  </article>
  <section id="library"><details id="coverage"><summary>按病害形态查看来源覆盖</summary><div class="tablewrap"><table id="coverageTable"><caption>各类资产记录数，点击数量筛选。不同采集帧和同一井体的不同姿态分别计数。</caption></table></div></details><div class="sectionhead"><h2>资产目录</h2><span id="count" role="status"></span></div>
    <div class="filters"><label>检索<input id="query" type="search" placeholder="编号、形态或材质"></label><label>重建方式<select id="method"><option value="">所有方式</option></select></label><label>病害类别<select id="category"><option value="">所有类别</option></select></label></div>
    <div id="cards"></div><div class="pager"><button id="prev">上一页</button><output id="page"></output><button id="next">下一页</button></div>
  </section>
</main>
<script src="catalog.js"></script><script src="relief.js"></script><script src="atlas.js"></script>
</html>
