<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道路病害 · 车载传感器对照</title><link rel="stylesheet" href="viewer/style.css"><script src="viewer/index.js"></script></head>
<body><header><div class="wrap mast"><span>道路病害资产库</span><a href="使用说明.txt">数据与使用说明 ↗</a></div></header>
<main class="wrap"><h1>车载传感器对照</h1>
<p class="intro">同一处路面病害，从车辆接近到驶过，对照实拍画面、激光回波和三维剖面。</p>
<div class="controls"><label>病害类别<select id="category"><option value="raised">异常井盖</option><option value="missing">缺盖井</option><option value="pothole">坑洞</option></select></label><label class="asset-label">资产<select id="asset"></select></label><label>路段<select id="site"><option>034</option><option>109</option><option>110</option></select></label><div class="camtab" aria-label="相机"><button id="front" type="button">前视</button><button id="back" type="button">后视</button></div></div>
<section aria-labelledby="ttl"><div class="bar"><h2 id="ttl">车载相机</h2><span id="frame" class="meta"></span></div>
<div class="photos"><figure><a id="before-a"><img id="before" alt="同帧原始车载相机图像"></a><figcaption>迁入前</figcaption></figure><figure><a id="after-a"><img id="after" alt="同帧迁入三维资产后的图像"></a><figcaption>迁入后</figcaption></figure></div><div id="capture" class="caption"></div></section>
<div class="technical"><section class="panel"><div class="bar"><h2>激光点云</h2><div class="smalltab"><button type="button" id="old">迁入前</button><button type="button" id="new">迁入后</button></div></div><canvas id="cloud" aria-label="可旋转的同帧局部激光点云" tabindex="0"></canvas><div class="legend"><span><i class="ground"></i>原回波</span><span><i class="low"></i>坑壁或井壁</span><span><i class="rim"></i>井沿</span><span><i class="plate"></i>盖板</span></div><div class="caption" id="rayStats"></div><div class="hint">拖动旋转，方向键微调。网格间距 0.5 米。</div></section>
<section class="panel"><div class="bar"><h2>几何剖面</h2><span class="meta" id="sliceTitle"></span></div><canvas id="profile" aria-label="可见表面和下层固体的高度剖面"></canvas><div class="slicectrl"><label for="slice">截取位置 Y</label><input type="range" id="slice" min="0" value="0" step="1"></div><div class="legend"><span><i class="top"></i>最上表面</span><span><i class="base"></i>下层固体</span></div><div class="hint">高度以局部路面为零。积水下方缺少几何时，下层曲线留空。</div></section></div>
<nav class="links" aria-label="相关文件"><a id="sourceLink">生成原图 ↗</a><a id="plyLink">3DGS 资产 ↗</a><a id="meshLink">三角网格 ↗</a><a id="depthLink">本帧深度与法线 ↗</a><a id="deltaLink">雷达回放增量 ↗</a><a id="heightLink">厘米级高度网格 ↗</a></nav>
<p class="foot">道路背景与原始扫描来自 PandaSet。病害几何、迁入图像和替换回波均为合成数据。</p></main><script src="viewer/app.js"></script></body></html>
